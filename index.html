<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fragenkatalog Fachgespräch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#EBEEF1; --panel:#FFFFFF; --panel-2:#F5F7F9; --ink:#172A3F; --muted:#5A6673;
    --line:#DCE2E7; --accent:#0E7C86; --accent-ink:#0B5A63; --navy:#132033; --chip:#E4F1F2;
    --proj:#0E7C86; --proj-bg:#E1F0F1; --fach:#4B57B8; --fach-bg:#E9EBFA;
    --shadow:0 1px 3px rgba(19,32,51,.07),0 8px 24px rgba(19,32,51,.05);
    --display:'Space Grotesk',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
  }
  :root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
    :root{--bg:#0E1826;--panel:#16233A;--panel-2:#1B2A42;--ink:#EAF0F6;--muted:#9DB0C4;--line:#2A3A54;--accent:#3FA9B4;--accent-ink:#7FD0D8;--navy:#0A1220;--chip:#183038;--proj:#3FA9B4;--proj-bg:#12333B;--fach:#8B95E8;--fach-bg:#1E2440;--shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}
  }}
  :root[data-theme="dark"]{--bg:#0E1826;--panel:#16233A;--panel-2:#1B2A42;--ink:#EAF0F6;--muted:#9DB0C4;--line:#2A3A54;--accent:#3FA9B4;--accent-ink:#7FD0D8;--navy:#0A1220;--chip:#183038;--proj:#3FA9B4;--proj-bg:#12333B;--fach:#8B95E8;--fach-bg:#1E2440;--shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;margin:0;-webkit-text-size-adjust:100%}
  .wrap{max-width:1000px;margin:0 auto;padding-block:28px 80px;padding-left:16px;padding-right:16px}

  header.mast{background:var(--navy);color:#EAF0F6;border-radius:18px;padding:32px 32px 28px;box-shadow:var(--shadow)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:#4FB6C0;margin:0}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(27px,5vw,40px);line-height:1.08;margin:9px 0 8px;text-wrap:balance}
  .mast p.sub{color:#AFC0D2;font-size:15.5px;margin:0;max-width:70ch}
  .mast .hint{color:#8EA1B6;font-size:13.5px;margin:14px 0 0;max-width:80ch}

  .toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:18px 0 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .viewseg{display:flex;flex-wrap:wrap;gap:6px}
  .viewseg button{font-family:var(--display);font-size:13.5px;font-weight:600;padding:9px 15px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);color:var(--muted);cursor:pointer}
  .viewseg button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tabs{display:flex;flex-wrap:wrap;gap:8px}
  .tab{font-family:var(--display);font-weight:600;font-size:13.5px;border-radius:99px;padding:8px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
  .tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tab:focus-visible,.viewseg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .row2{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .search{flex:1 1 220px;min-width:0;font-family:var(--body);font-size:15px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{font-family:var(--body);font-size:13.5px;font-weight:500;padding:9px 13px;border:none;background:var(--panel-2);color:var(--muted);cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--chip);color:var(--accent-ink);font-weight:600}
  .btn{font-family:var(--display);font-weight:600;font-size:13.5px;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{color:#fff;filter:brightness(1.05)}
  .count{color:var(--muted);font-size:13.5px;margin-left:auto;font-variant-numeric:tabular-nums}

  .intro{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:20px;font-size:14px;color:var(--ink);display:none}
  .intro.show{display:block}
  .intro b{color:var(--accent-ink)}

  .frGroup > h2{font-family:var(--display);font-size:22px;font-weight:700;margin:30px 2px 2px;color:var(--ink)}
  .frGroup > .frsub{color:var(--muted);font-size:13px;margin:0 2px 6px;font-weight:500}
  .spGroup > h3{font-family:var(--display);font-size:16.5px;font-weight:600;margin:20px 2px 12px;color:var(--accent-ink);display:flex;align-items:center;gap:10px}
  .spGroup > h3::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
  .flat{margin-top:12px}

  .qcard{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  .qhead{width:100%;text-align:left;background:none;border:none;cursor:pointer;display:flex;gap:14px;align-items:flex-start;padding:18px 20px;font-family:var(--body);color:var(--ink)}
  .qhead:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .badge{flex:none;font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;border-radius:6px;padding:4px 8px;margin-top:2px}
  .badge.proj{background:var(--proj-bg);color:var(--proj)}
  .badge.fach{background:var(--fach-bg);color:var(--fach)}
  .qtext{flex:1;font-size:16.5px;font-weight:500;line-height:1.4}
  .chev{flex:none;color:var(--muted);transition:transform .2s;margin-top:3px}
  .qcard.open .chev{transform:rotate(90deg)}
  .qans{border-top:1px solid var(--line);padding:4px 20px 18px 54px;display:none}
  .qcard.open .qans{display:block}
  .qans ul{margin:14px 0 0;padding-left:20px}
  .qans li{font-size:15.5px;color:var(--muted);margin:6px 0;line-height:1.45}

  .empty{color:var(--muted);text-align:center;padding:48px 0;font-size:15px}

  .practice{background:var(--panel);border:1px solid var(--accent);border-radius:14px;box-shadow:var(--shadow);padding:26px;margin-bottom:24px}
  .practice .pmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .practice .pq{font-size:21px;font-weight:600;line-height:1.35;font-family:var(--display)}
  .practice .pans{margin-top:16px;display:none}
  .practice.revealed .pans{display:block}
  .practice .pans ul{padding-left:20px;margin:0}
  .practice .pans li{font-size:16px;color:var(--muted);margin:7px 0}
  .practice .pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
  .pfrom{color:var(--muted);font-size:13px;margin-top:10px}

  @media (max-width:560px){ header.mast{padding:24px 18px} .qans{padding-left:20px} }
  @media print{
    :root{--bg:#fff;--panel:#fff;--panel-2:#fff}
    .toolbar,.practice,.btn,.chev,.intro{display:none!important}
    header.mast{background:#fff;color:#000;border:1px solid #999;box-shadow:none}
    .eyebrow{color:#0B5A63}.mast p.sub,.mast .hint{color:#333}h1{color:#111}
    .qcard{box-shadow:none;break-inside:avoid}
    .qans{display:block!important}
    .frGroup>h2{break-after:avoid}.spGroup>h3{break-after:avoid}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="eyebrow">Vorbereitung Fachgespräch</p>
    <h1 id="mast-title"></h1>
    <p class="sub" id="mast-sub"></p>
    <p class="hint" id="mast-hint"></p>
  </header>

  <div class="toolbar">
    <div class="viewseg" id="viewSeg" role="group" aria-label="Ansicht">
      <button data-view="fach" aria-pressed="true">Fachrichtungen</button>
      <button data-view="szen" aria-pressed="false">Projektszenarien</button>
      <button data-view="live" aria-pressed="false">Livestream Präsentation</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="row2">
      <input class="search" id="search" type="search" placeholder="Fragen durchsuchen …" autocomplete="off">
      <div class="seg" id="typeSeg" role="group" aria-label="Fragetyp">
        <button data-typ="all" aria-pressed="true">Alle</button>
        <button data-typ="Projekt" aria-pressed="false">Projekt</button>
        <button data-typ="Fachwissen" aria-pressed="false">Fachwissen</button>
      </div>
    </div>
    <div class="row2">
      <button class="btn primary" id="practiceBtn" type="button">Übungsmodus</button>
      <button class="btn" id="toggleAll" type="button">Alle Antworten zeigen</button>
      <button class="btn" id="printBtn" type="button">Drucken / PDF</button>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div class="intro" id="intro"></div>
  <div id="practiceWrap"></div>
  <div id="list"></div>
</div>

<script>
const CATALOG = {"titel": "Fragenkatalog Fachgespräch", "untertitel": "Berufsspezialist – vier Fachrichtungen, gegliedert nach Qualifikationsschwerpunkten", "hinweis": "Projektbezogene Fragen (Typ: Projekt) beziehen sich beispielhaft auf das IoT-Cloud-Migrationsprojekt bzw. auf das eigene Projekt der jeweiligen Fachrichtung. Allgemeine Fragen (Typ: Fachwissen) prüfen das grundlegende Verständnis.", "fachrichtungen": [{"id": "si", "name": "Systemintegration und Vernetzung", "schwerpunkte": [{"name": "Planung, Konzeptionierung, Integration", "fragen": [{"typ": "Projekt", "q": "Warum haben Sie sich für eine hybride Architektur statt einer reinen Cloud-Lösung entschieden?", "a": ["Datensouveränität bei personenbeziehbaren Standort-/Bewegungsdaten", "Risiko des Zugriffs durch Dritte bei US-Anbietern (CLOUD Act)", "Sensible Zuordnung bleibt on-premise, nur pseudonymisierte Daten in der Cloud", "Skalierbarkeit/Hochverfügbarkeit trotzdem aus der Cloud"]}, {"typ": "Projekt", "q": "Warum haben Sie MQTT als Protokoll gewählt und nicht HTTPS?", "a": ["MQTT ist leichtgewichtig (Publish/Subscribe), geringer Overhead", "Gut geeignet für viele Geräte mit schmaler Bandbreite", "Lässt sich über TLS (MQTTS) absichern", "HTTPS ist Request/Response-orientiert mit mehr Overhead"]}, {"typ": "Fachwissen", "q": "Was ist der Unterschied zwischen IaaS, PaaS und SaaS?", "a": ["IaaS: Infrastruktur (VMs, Speicher, Netz)", "PaaS: Plattform/Laufzeitumgebung zum Entwickeln und Betreiben", "SaaS: fertige Anwendung", "Eigenverantwortung nimmt von IaaS zu SaaS ab"]}, {"typ": "Fachwissen", "q": "Welche Vor- und Nachteile hat ein Managed Service gegenüber IaaS?", "a": ["Managed: weniger Betrieb/Wartung, schneller einsatzbereit", "Managed: weniger Kontrolle, stärkere Anbieterbindung", "IaaS: volle Kontrolle, aber mehr Aufwand und Know-how nötig"]}, {"typ": "Fachwissen", "q": "Was versteht man unter Virtualisierung und welche Vorteile bringt sie?", "a": ["Mehrere virtuelle Systeme auf einer physischen Hardware", "Bessere Auslastung, Isolation, schnelle Bereitstellung", "Snapshots, einfache Skalierung und Migration"]}]}, {"name": "Sicherstellung des laufenden Betriebs", "fragen": [{"typ": "Fachwissen", "q": "Was bedeuten RTO und RPO?", "a": ["RTO (Recovery Time Objective): maximale Wiederanlaufzeit nach einem Ausfall", "RPO (Recovery Point Objective): maximal tolerierter Datenverlust (Zeitraum seit letztem Backup)"]}, {"typ": "Projekt", "q": "Wie stellen Sie sicher, dass Ihr Backup im Ernstfall funktioniert?", "a": ["Regelmäßige Restore-Tests / Wiederanlaufübungen nach Notfallhandbuch", "Ein nie zurückgespieltes Backup ist keine echte Sicherheit", "Ergebnisse dokumentieren"]}, {"typ": "Fachwissen", "q": "Erklären Sie das 3-2-1-Backup-Prinzip.", "a": ["3 Kopien der Daten", "auf 2 verschiedenen Medien", "1 davon räumlich getrennt (offsite)"]}, {"typ": "Fachwissen", "q": "Was ist Georedundanz und warum ist sie sinnvoll?", "a": ["Replikation über räumlich getrennte Rechenzentren/Regionen", "Schützt vor dem Ausfall eines kompletten Standorts"]}, {"typ": "Fachwissen", "q": "Worin unterscheiden sich Hochverfügbarkeit und Backup?", "a": ["Hochverfügbarkeit: Ausfälle vermeiden/überbrücken (Redundanz, Failover, Uptime)", "Backup: Daten nach Verlust wiederherstellen", "Beide ergänzen sich, ersetzen sich aber nicht"]}]}, {"name": "Qualitätssicherung und IT-Sicherheit", "fragen": [{"typ": "Projekt", "q": "Welche Tests haben Sie durchgeführt und mit welchen Erfolgskriterien?", "a": ["Lasttest (Durchsatz bei Lastspitzen)", "Restore-Simulation (RTO nachgewiesen)", "Integrationstest (Daten vollständig und korrekt)", "Failover-Test (automatischer Umschwenk < 60 s)"]}, {"typ": "Fachwissen", "q": "Wie bewertet man Risiken systematisch?", "a": ["Nach Eintrittswahrscheinlichkeit und Auswirkung (Risikomatrix)", "Daraus Maßnahmen ableiten und priorisieren"]}, {"typ": "Fachwissen", "q": "Was ist Infrastructure as Code und welchen Vorteil bietet es?", "a": ["Infrastruktur wird als Code/Vorlage definiert", "Reproduzierbar, versionierbar, überprüfbar", "Reduziert Fehlkonfigurationen"]}, {"typ": "Projekt", "q": "Was war Ihr größtes Migrationsrisiko und wie sind Sie damit umgegangen?", "a": ["Datenverlust während der Migration", "Parallelbetrieb von Alt- und Neusystem", "Abgleich und Validierung vor dem endgültigen Cutover"]}]}, {"name": "Organisatorische und rechtliche Vorgaben", "fragen": [{"typ": "Fachwissen", "q": "Was ist der Unterschied zwischen Pseudonymisierung und Anonymisierung?", "a": ["Pseudonymisierung: mit Zusatzwissen (Schlüssel) umkehrbar → bleibt personenbezogen i. S. DSGVO", "Anonymisierung: nicht mehr rückführbar → kein Personenbezug mehr"]}, {"typ": "Projekt", "q": "Warum ist bei Fahrzeug- und Standortdaten der Datenschutz besonders wichtig?", "a": ["Standort-/Bewegungsdaten sind personenbeziehbar (Bewegungsprofile)", "Hoher Schutzbedarf; DSGVO, Zweckbindung, Datenminimierung"]}, {"typ": "Fachwissen", "q": "Nennen Sie zentrale Grundsätze der DSGVO.", "a": ["Rechtmäßigkeit, Zweckbindung, Datenminimierung", "Speicherbegrenzung, Integrität und Vertraulichkeit", "Rechenschaftspflicht"]}, {"typ": "Fachwissen", "q": "Was gehört in ein Datensicherheitskonzept?", "a": ["Schutzbedarf, Rollen-/Rechtekonzept", "Verschlüsselung, Backup, Zugriffskontrolle", "Löschkonzept und Notfallvorsorge"]}]}, {"name": "Projektunterstützung und -koordination", "fragen": [{"typ": "Projekt", "q": "Wie haben Sie den Aufwand für Ihr Projekt geschätzt?", "a": ["Aufteilung in Phasen", "Erfahrungswerte und Vergleich mit ähnlichen Aufgaben", "Kalkulation in Personentagen"]}, {"typ": "Fachwissen", "q": "Welche Phasen hat ein IT-Projekt typischerweise?", "a": ["Initialisierung/Analyse, Planung", "Umsetzung, Test/Abnahme", "Rollout, Betrieb/Nachbetreuung"]}, {"typ": "Fachwissen", "q": "Was versteht man unter Projektcontrolling?", "a": ["Überwachung von Zeit, Kosten und Qualität", "Soll-Ist-Vergleich, Statusberichte, Gegensteuern"]}, {"typ": "Fachwissen", "q": "Was ist der Unterschied zwischen Lasten- und Pflichtenheft?", "a": ["Lastenheft: Anforderungen des Auftraggebers (das Was)", "Pflichtenheft: geplante Umsetzung des Auftragnehmers (das Wie)"]}]}]}, {"id": "sec", "name": "IT-Sicherheit (Informationssicherheit)", "schwerpunkte": [{"name": "Bedrohungs- und Risikoszenarien analysieren", "fragen": [{"typ": "Fachwissen", "q": "Nennen Sie die drei Schutzziele der Informationssicherheit.", "a": ["Vertraulichkeit, Integrität, Verfügbarkeit (CIA)", "Ergänzend oft Authentizität und Nichtabstreitbarkeit"]}, {"typ": "Fachwissen", "q": "Worin unterscheiden sich Bedrohung, Schwachstelle und Risiko?", "a": ["Bedrohung: potenzielle Gefahr", "Schwachstelle: ausnutzbarer Angriffspunkt", "Risiko: Eintrittswahrscheinlichkeit × Schadenshöhe"]}, {"typ": "Fachwissen", "q": "Was ist eine Datenschutz-Folgenabschätzung (DSFA)?", "a": ["Bewertung der Risiken für Betroffene bei riskanter Datenverarbeitung", "Nach DSGVO Art. 35 verpflichtend bei voraussichtlich hohem Risiko"]}, {"typ": "Projekt", "q": "Wie sind Sie in Ihrem Projekt bei der Schwachstellen- und Risikoanalyse vorgegangen?", "a": ["Systeme, Netzverkehr und Konfigurationen analysiert", "Risiken nach Wahrscheinlichkeit/Auswirkung bewertet", "Risikominimierende Gegenmaßnahmen abgeleitet"]}]}, {"name": "Sicherheitsmaßnahmen planen", "fragen": [{"typ": "Fachwissen", "q": "Was ist ein ISMS?", "a": ["Informationssicherheits-Managementsystem", "Prozesse und Regeln zur Steuerung der Informationssicherheit", "Rahmenwerke: ISO/IEC 27001, BSI IT-Grundschutz"]}, {"typ": "Fachwissen", "q": "Was ist ein Rechte- und Rollenkonzept?", "a": ["Zugriffsrechte werden über Rollen vergeben", "Least Privilege (so wenig Rechte wie nötig)", "Funktionstrennung"]}, {"typ": "Fachwissen", "q": "Warum ist Datenklassifizierung sinnvoll?", "a": ["Daten nach Schutzbedarf einstufen (öffentlich/intern/vertraulich/streng vertraulich)", "Passende Schutzmaßnahmen je Klasse"]}, {"typ": "Projekt", "q": "Wie sind Sie beim Erstellen eines Sicherheitskonzepts vorgegangen?", "a": ["Schutzbedarf ermittelt", "Maßnahmen und Sicherheitsrichtlinien definiert", "Umsetzung und Wirksamkeitsprüfung geplant"]}]}, {"name": "Sicheren Betrieb gewährleisten", "fragen": [{"typ": "Fachwissen", "q": "Was ist ein SIEM?", "a": ["Security Information and Event Management", "Zentrales Sammeln und Korrelieren von Sicherheitsereignissen", "Zur Erkennung und Auswertung von Vorfällen"]}, {"typ": "Fachwissen", "q": "Was bedeutet Ende-zu-Ende-Verschlüsselung?", "a": ["Nur Sender und Empfänger können entschlüsseln", "Zwischenstationen sehen nur das Chiffrat"]}, {"typ": "Fachwissen", "q": "Wie sichert man vernetzte (IoT-)Geräte ab?", "a": ["Geräteauthentifizierung über Zertifikate (X.509)", "Verschlüsselte Kommunikation, sichere Updates", "Netzsegmentierung"]}, {"typ": "Projekt", "q": "Wie gehen Sie bei einem akuten Sicherheitsvorfall vor?", "a": ["Erkennen und eindämmen", "Beweise sichern, Ursache beheben", "Wiederanlauf, dokumentieren, Lessons Learned (Incident Response)"]}]}, {"name": "Sicherheitsmaßnahmen einleiten, dokumentieren und evaluieren", "fragen": [{"typ": "Fachwissen", "q": "Warum ist eine beweissichere Dokumentation von Sicherheitsvorfällen wichtig?", "a": ["Nachvollziehbarkeit und ggf. rechtliche Verwertbarkeit (Forensik)", "Grundlage für Verbesserung und Prävention"]}, {"typ": "Fachwissen", "q": "Was ist ein Notfallhandbuch?", "a": ["Dokumentierte Notfall- und Wiederanlaufprozeduren", "Verantwortlichkeiten und Kommunikationswege für den Ernstfall"]}, {"typ": "Fachwissen", "q": "Wie prüft man die Wirksamkeit von Präventionsmaßnahmen?", "a": ["Tests, Audits und Schwachstellenscans", "Kennzahlen auswerten, Maßnahmen nachjustieren"]}, {"typ": "Projekt", "q": "Wie haben Sie Ihre Sicherheitsinfrastruktur getestet und evaluiert?", "a": ["Auswahl und Durchführung geeigneter Tests", "Dokumentation der Ergebnisse und Schwachstellen", "Ableitung von Verbesserungsmaßnahmen"]}]}, {"name": "Organisatorische und rechtliche Vorgab   Array.prototype.forEach.call(viewSeg.children, function(b){
    b.addEventListener('click', function(){
      state.view=b.dataset.view;
      Array.prototype.forEach.call(viewSeg.children, function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      updateIntro(); buildTabs(); render(); save();
    });
  });
  Array.prototype.forEach.call(typeSeg.children, function(b){
    b.addEventListener('click', function(){
      state.typ=b.dataset.typ;
      Array.prototype.forEach.call(typeSeg.children, function(x){ x.setAttribute('aria-pressed', x===b?'true':'false'); });
      render(); save();
    });
  });
  search.addEventListener('input', function(){ state.q=search.value.trim().toLowerCase(); render(); save(); });

  document.getElementById('toggleAll').addEventListener('click', function(){
    allOpen=!allOpen;
    this.textContent = allOpen ? 'Alle Antworten verbergen' : 'Alle Antworten zeigen';
    Array.prototype.forEach.call(document.querySelectorAll('.qcard'), function(c){ c.classList.toggle('open', allOpen); });
  });
  document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

  function matchesFilter(it){
    if(state.typ!=='all' && it.typ!==state.typ) return false;
    if(state.q){ const hay=(it.q+' '+it.a.join(' ')).toLowerCase(); if(hay.indexOf(state.q)===-1) return false; }
    return true;
  }
  function filtered(){
    const gid=curGroupId();
    return curPool().filter(function(it){
      if(gid!=='all'){
        if(state.view==='fach'){ if(it.gId!==gid) return false; }
        else if(state.view==='szen'){ if(it.fach!==gid) return false; }
        else { if(it.gId!==gid) return false; }
      }
      return matchesFilter(it);
    });
  }
  function esc(s){ return s.replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  function badge(typ){ return '<span class="badge '+(typ==='Projekt'?'proj':'fach')+'">'+typ+'</span>'; }
  function qcardHTML(it){
    return '<div class="qcard"><button class="qhead" type="button">'+badge(it.typ)+
      '<span class="qtext">'+esc(it.q)+'</span><span class="chev">›</span></button>'+
      '<div class="qans"><ul>'+it.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div></div>';
  }

  function render(){
    renderPractice();
    const data=filtered();
    document.getElementById('count').textContent = data.length+(data.length===1?' Frage':' Fragen');
    if(data.length===0){ listEl.innerHTML='<div class="empty">Keine Fragen für diese Auswahl.</div>'; return; }
    let html='';
    if(state.view==='fach'){
      const wanted=(state.groupFach==='all')?null:state.groupFach;
      FACH.forEach(function(fr){
        if(wanted && fr.id!==wanted) return;
        const arr=data.filter(function(it){return it.gId===fr.id;});
        if(!arr.length) return;
        html+='<div class="frGroup">';
        if(state.groupFach==='all') html+='<h2>'+esc(fr.name)+'</h2>';
        fr.schwerpunkte.forEach(function(sp){
          const sub=arr.filter(function(it){return it.sub===sp.name;});
          if(!sub.length) return;
          html+='<div class="spGroup"><h3>'+esc(sp.name)+'</h3>'+sub.map(qcardHTML).join('')+'</div>';
        });
        html+='</div>';
      });
    } else if(state.view==='szen'){
      const wanted=(state.groupSzen==='all')?null:state.groupSzen;
      SZEN.forEach(function(sz){
        if(wanted && sz.fachrichtung!==wanted) return;
        const arr=data.filter(function(it){return it.gId===sz.id;});
        if(!arr.length) return;
        html+='<div class="frGroup"><h2>'+esc(sz.name)+'</h2><p class="frsub">Fachrichtung: '+esc(sz.fachrichtung)+'</p><div class="flat">'+arr.map(qcardHTML).join('')+'</div></div>';
      });
    } else {
      const wanted=(state.groupLive==='all')?null:state.groupLive;
      LIVE.forEach(function(sz){
        if(wanted && sz.id!==wanted) return;
        const arr=data.filter(function(it){return it.gId===sz.id;});
        if(!arr.length) return;
        html+='<div class="frGroup"><h2>'+esc(sz.name)+'</h2><div class="flat">'+arr.map(qcardHTML).join('')+'</div></div>';
      });
    }
    listEl.innerHTML=html;
    Array.prototype.forEach.call(listEl.querySelectorAll('.qhead'), function(btn){ btn.addEventListener('click', function(){ btn.parentElement.classList.toggle('open'); }); });
    if(allOpen) Array.prototype.forEach.call(listEl.querySelectorAll('.qcard'), function(c){ c.classList.add('open'); });
  }

  function labelFor(it){
    if(state.view==='fach'){ const fr=FACH.filter(function(f){return f.id===it.gId;})[0]; return (fr?fr.name:'')+(it.sub?' · '+it.sub:''); }
    if(state.view==='szen'){ const sz=SZEN.filter(function(s){return s.id===it.gId;})[0]; return sz?sz.name+' · '+sz.fachrichtung:''; }
    const lz=LIVE.filter(function(s){return s.id===it.gId;})[0]; return lz?'Livestream · '+lz.name:'';
  }
  function pickRandom(){ const d=filtered(); current = d.length? d[Math.floor(Math.random()*d.length)] : null; }
  function renderPractice(){
    if(!practiceOn){ practiceWrap.innerHTML=''; return; }
    if(!current){ practiceWrap.innerHTML='<div class="practice"><p class="pq">Keine Frage für diese Auswahl.</p></div>'; return; }
    const it=current;
    practiceWrap.innerHTML='<div class="practice" id="pcard"><div class="pmeta">'+badge(it.typ)+
      '<span class="pfrom" style="margin:0">'+esc(labelFor(it))+'</span></div>'+
      '<div class="pq">'+esc(it.q)+'</div>'+
      '<div class="pans"><ul>'+it.a.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>'+
      '<div class="pbtns"><button class="btn primary" id="revealBtn" type="button">Antwort zeigen</button>'+
      '<button class="btn" id="nextBtn" type="button">Nächste Frage</button>'+
      '<button class="btn" id="closePractice" type="button">Übungsmodus beenden</button></div></div>';
    document.getElementById('revealBtn').addEventListener('click', function(){ document.getElementById('pcard').classList.add('revealed'); });
    document.getElementById('nextBtn').addEventListener('click', function(){ pickRandom(); renderPractice(); });
    document.getElementById('closePractice').addEventListener('click', function(){ practiceOn=false; renderPractice(); });
  }
  document.getElementById('practiceBtn').addEventListener('click', function(){ practiceOn=true; pickRandom(); renderPractice(); window.scrollTo({top:0,behavior:'smooth'}); });

  function save(){ try{ localStorage.setItem('fk-state4', JSON.stringify(state)); }catch(e){} }
  function load(){ try{ const s=JSON.parse(localStorage.getItem('fk-state4')||'{}'); ['view','groupFach','groupSzen','groupLive','typ','q'].forEach(function(k){ if(s[k]!==undefined) state[k]=s[k]; }); if(state.q) search.value=state.q; }catch(e){} }

  load();
  Array.prototype.forEach.call(viewSeg.children, function(x){ x.setAttribute('aria-pressed', x.dataset.view===state.view?'true':'false'); });
  Array.prototype.forEach.call(typeSeg.children, function(x){ x.setAttribute('aria-pressed', x.dataset.typ===state.typ?'true':'false'); });
  updateIntro(); buildTabs(); render();
})();
</script>

</body>
</html>
